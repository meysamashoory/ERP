<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>گزارش ذخیره شد</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Tahoma, "Segoe UI", sans-serif;
      background: #e8edf4;
      color: #0f172a;
    }
    .box {
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 20px 24px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      text-align: center;
      max-width: 360px;
    }
    .muted { color: #64748b; font-size: 13px; margin-top: 8px; }
    a { color: #1d4ed8; }
  </style>
</head>
<body>
  <div class="box">
    <div>{{ message|default:"گزارش ذخیره شد" }}</div>
    <div class="muted">در حال بستن پنجره</div>
    <div class="muted">
      <a id="fallback-link" href="{{ list_url }}">بازگشت به لیست گزارش‌ها</a>
    </div>
  </div>
  <script>
  (function () {
    var listUrl = document.getElementById("fallback-link").getAttribute("href") || "/reports/";
    try {
      if (window.opener && !window.opener.closed) {
        try { window.opener.location.href = listUrl; } catch (e) {
          try { window.opener.location.reload(); } catch (err) {}
        }
      }
    } catch (e) {}
    try { window.close(); } catch (e) {}
    setTimeout(function () {
      if (!window.closed) window.location.href = listUrl;
    }, 250);
  })();
  </script>
</body>
</html>
